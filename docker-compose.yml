services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: campusmate_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campusmate}
      POSTGRES_USER: ${POSTGRES_USER:-campusmate_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campusmate_secure_pass_2026}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-campusmate_user} -d ${POSTGRES_DB:-campusmate}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: campusmate_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

#  minio:
#    image: quay.io/minio/minio:latest
#    container_name: campusmate_minio
#    restart: always
#    command: server /data --console-address ":9001"
#    environment:
#      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-campusmate_minio}
#      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secure_pass_2026}
#    ports:
#      - "9000:9000"
#      - "9001:9001"
#    volumes:
#      - miniodata:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campusmate_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-campusmate_user}:${POSTGRES_PASSWORD:-campusmate_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-campusmate}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-campusmate_minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio_secure_pass_2026}
      JWT_SECRET: ${JWT_SECRET:-campusmate_jwt_super_secret_key_prod_2026_xyz}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-demo_key}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campusmate_frontend
    restart: always
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000/api/v1
    ports:
      - "3000:3000"

volumes:
  pgdata:
  redisdata:
  # miniodata:


version: "3.9"

services:
  huce-kiosk-server:
    build: .
    container_name: huce_smart_ai_kiosk
    ports:
      - "8000:8000"
    environment:
      - HUCE_DB_PATH=/app/data/huce_academic_kiosk.db
      - HUCE_JWT_SECRET=huce_secure_kiosk_secret_key_production_2026
      - HUCE_ALLOWED_ORIGINS=http://localhost:8000,http://127.0.0.1:8000
      - HUCE_ADMIN_PIN=999888
      - HUCE_ALLOW_SIMULATION=false
    volumes:
      - huce_db_data:/app/data
    restart: unless-stopped

volumes:
  huce_db_data:
